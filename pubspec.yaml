name: sona
description: SONA - reproductor de música multiplataforma (Windows, Linux, Android)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13   # media session + notificación en Android
  just_audio_media_kit: ^2.0.5            # backend de audio para Windows/Linux
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  audio_metadata_reader: ^1.4.2           # título/artista/álbum/portada (Dart puro)
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  window_manager: ^0.4.2
  tray_manager: ^0.2.3                    # bandeja del sistema (Windows/Linux)
  smtc_windows: ^1.0.0                    # teclas multimedia + overlay en Windows
  audio_service: ^0.18.15                 # base para MPRIS en Linux
  audio_service_mpris: ^0.1.2             # teclas multimedia/MPRIS en Linux

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
